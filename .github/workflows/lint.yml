name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Run lint check
        working-directory: assignment1
        run: make lint

      - name: Auto-fix and check for diff
        working-directory: assignment1
        run: |
          make lint-fix
          git diff --exit-code
